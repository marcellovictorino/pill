name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - run: go test ./...
  vulncheck:
    # Known-vulnerability scan of the Go dependencies and standard library the binary actually calls.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Confirms downloaded modules match go.sum, so a tampered dependency fails the build.
      - run: go mod verify
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
