name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `pill doctor`
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `pill version`
    validations:
      required: true
