# Models pill knows how to download and serve. Embedded in the binary.
# A model can have several variants (quantisations); the one marked default
# is what the short name (for example "gemma4-26b") resolves to.
# Verified against the Hugging Face repo listing on 2026-10-08.
#
# The catalog holds references only (source, repo, file name, size), never
# model weights; weights download when someone runs `pill pull`.
# Each variant may carry [[model.variant.measurement]] results, each tied to
# one exact chip + memory profile. A recommendation needs a standard pass
# (tier1 and tier2 both "pass") on the same chip and memory as the machine.
#
# 16 GB machines: no gemma4-26b variant fits (min_ram_gb 24). The 16 GB M2 Pro
# results (pill 0.4.1, llama.cpp build 11146, 2026-10-09) are [[tried]] records
# below; nothing passed both tiers. The Metal working set is roughly 10.7 GB,
# so model plus KV cache must fit under that, not under 16 GB.
#
# [[tried]] entries hold results for models that are not offered: they have no
# repo or file, so they never appear as something to pull. `pill catalog` shows
# them in its "tried on this Mac" block when fewer than three models pass.
# Records converted from evals/reports/tried-and-rejected.md name their table
# row in source_row and keep the least favourable reported value per field.

[[model]]
name = "gemma4-26b"
repo = "unsloth/gemma-4-26B-A4B-it-GGUF"
source = "huggingface"
reasoning = true
max_tokens = 16384

[model.preset]
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0

[[model.variant]]
quant = "UD-IQ4_XS"
file = "gemma-4-26B-A4B-it-UD-IQ4_XS.gguf"
size_gb = 13.6
ctx = 65536
min_ram_gb = 24
default = true

[[model.variant]]
quant = "UD-Q3_K_XL"
file = "gemma-4-26B-A4B-it-UD-Q3_K_XL.gguf"
size_gb = 12.9
ctx = 65536
min_ram_gb = 24

# Measured on a 16 GB M2 Pro: the only gemma4-26b file that came close, and it
# did not load. Kept so the failure is attributable to that device.
[[model.variant.measurement]]
chip = "Apple M2 Pro"
ram_gb = 16
ctx = 65536
tier1 = "fail"
runs = 1
date = "2026-10-09"
pill = "0.4.1"
llama_cpp = "build 11146"
gate = "tier 1 60 s"
source = "evals/reports/summary.md"
note = "Metal out of memory; the Metal working set is about 10.7 GB"
fail_reason = "Metal out of memory"

