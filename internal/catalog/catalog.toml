# Models pill knows how to download and serve. Embedded in the binary.
# A model can have several variants (quantisations); the one marked default
# is what the short name (for example "gemma4-26b") resolves to.
# Verified against the Hugging Face repo listing on 2026-10-08.
#
# The catalog holds references only (source, repo, file name, size), never
# model weights; weights download when someone runs `pill pull`.
# Each variant may carry [[model.variant.measurement]] results, each tied to
# one exact chip + memory profile. A recommendation needs a standard pass
# (tier1 and tier2 both "pass") on the same chip and memory as the machine.
#
# 16 GB machines: no gemma4-26b variant fits (min_ram_gb 24). Results on a 16 GB
# M2 Pro are recorded in two batches: 2026-10-09 (pill 0.4.1, llama.cpp build
# 11146) and 2026-11-04 (pill 0.4.1, llama.cpp build 11960, macOS 27.2), the
# latter between the BEGIN/END markers at the end of this file plus a MiniCPM
# measurement on its variant. Nothing passed both tiers. The Metal working set
# is roughly 10.7 GB, so model plus KV cache must fit under that, not under 16 GB.
#
# How records are made: every measurement is copied by hand from `pill bench run`
# output (Tier 3 from evals/run.py) and from the reports under evals/reports/;
# nothing here is generated. fail_reason uses one form: "Tier 1 ..." or "Tier 2
# ..." first, then the number (for example "Tier 2 scored 19/22").
#
# IDs: `id` is the short name shown by `pill catalog` and accepted by commands;
# a [[model]] maps it to repo and file, a [[tried]] has only results. An ID is at
# most 17 characters (rows must stay under 90). A variant gets a suffix, as in
# qwen3.5-9b-mtp; "thinking on" is -think, and the Muse "thinking-off template"
# and "DFlash drafter" records are -nothink and -dflash (the full description
# stays in `name`). One id + quant + context names one record.
#
# [[tried]] entries hold results for models that are not offered: they have no
# repo or file, so they never appear as something to pull. `pill catalog` shows
# them as rows when fewer than three models pass.
# Records converted from evals/reports/tried-and-rejected.md name their table
# row in source_row and keep the least favourable reported value per field.

[[model]]
name = "gemma4-26b"
id = "gemma4-26b"
repo = "unsloth/gemma-4-26B-A4B-it-GGUF"
source = "huggingface"
reasoning = true
max_tokens = 16384

[model.preset]
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0

[[model.variant]]
quant = "UD-IQ4_XS"
file = "gemma-4-26B-A4B-it-UD-IQ4_XS.gguf"
size_gb = 13.6
ctx = 65536
min_ram_gb = 24
default = true

[[model.variant]]
quant = "UD-Q3_K_XL"
file = "gemma-4-26B-A4B-it-UD-Q3_K_XL.gguf"
size_gb = 12.9
ctx = 65536
min_ram_gb = 24

